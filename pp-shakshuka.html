","text":"Лопаткой сделайте в густом томатном соусе 3 углубления. Сначала распределите по сковороде дополнительный жидкий яичный белок ( 100 г ), а в сами лунки аккуратно выпустите 3 целых яйца С0 , чтобы желтки остались целыми. Посолите белки, накройте крышкой и готовьте на слабом огне 4–5 минут — белок должен полностью схватиться, а желток остаться нежным и текучим."},{"@type":"HowToStep","position":3,"name":"Подача с раскрошенной фетой и свежей кинзой","text":"Снимите сковороду с огня, посыпьте горячую шакшуку кубиками рассольного сыра Фета Light или Адыгейского ( 50 г ) и рубленой петрушкой с кинзой ( 15 г ). Всего 89,5 ккал на 100 г и почти 50 г белка на сковороду!"}]}</script></head>
