<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Карамельно-сливочный ПП-чизкейк (1 кг)","description":"Высокий, плотный и шелковистый белковый чизкейк весом 1 кг на брикетном твороге 0% и легкой сгущенке. Без муки и масла. От 137 до 153 г чистого белка на весь замес!","image":["https://bakan-off.github.io/pp-recipes/caramel-cheesecake-hero.jpg"],"recipeCategory":"Десерты","keywords":"Высокобелковое, Без сахара","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"143.5 ккал на 100 г","proteinContent":"13.7 г","fatContent":"3.9 г","carbohydrateContent":"13.4 г"},"recipeIngredient":["Творог «Красная цена» обезжиренный 0% — 540 г (3 пачки по 180 г)","Яйца куриные С0 (крупные) — 4 шт (~240 г без скорлупы)","Вареная сгущенка 4% — 220 г (~0.6 банки)","Ванилин — 1 пакетик (1–1.5 г)","Заменитель сахара (ФитПарад) — 1–2 стика (по вкусу)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Подготовка и соединение ингредиентов","text":"В глубокую миску или чашу для взбивания выложите 3 пачки творога «Красная цена» 0% (540 г) , разбейте 4 крупных яйца С0 , отмерьте на кухонных весах ровно 220 г вареной сгущенки 4% , всыпьте 1 пакетик ванилина и 1–2 стика ФитПарада для десертной сладости."},{"@type":"HowToStep","position":2,"name":"Взбивание блендером (секрет шелковистости)","text":"Творог «Красная цена» плотный и брикетный, поэтому вилкой или венчиком его не размешать. Погружным блендером тщательно пробивайте массу 2–3 минуты круговыми движениями , пока крупинки творога и густая варенка не превратятся в абсолютно гладкий, глянцевый карамельный крем цвета вареного сгущенного молока."},{"@type":"HowToStep","position":3,"name":"Подготовка формы (16–18 см)","text":"Для такого объема (1 кг массы) идеальна форма диаметром 16–18 см — чизкейк получится высоким и красивым. Если используете металлическую разъемную форму, застелите дно пергаментом, а бортики смажьте каплей масла. Если форма силиконовая — можно выливать крем сразу."},{"@type":"HowToStep","position":4,"name":"Выпекание (в духовке или аэрогриле)","text":"В духовке: разогрейте духовку до 175–180°C . Выпекайте на среднем уровне 40–45 минут . Верх схватится и красиво подрумянится, а серединка при покачивании формы может слегка подрагивать (это нормально для нежного творожного суфле). В аэрогриле: выпекайте при 160°C ровно 35 минут . За это время верхушка равномерно схватится и приобретет аппетитную золотистую корочку."},{"@type":"HowToStep","position":5,"name":"Охлаждение и стабилизация в холоде","text":"Не нарезайте чизкейк горячим! Дайте ему остыть прямо в форме при комнатной температуре около 1 часа, затем уберите в холодильник минимум на 2–3 часа (а лучше на ночь) . Молочный и яичный белок стабилизируются, текстура станет плотной, монолитной и тающей во рту, как настоящее крем-брюле."}]}</script></head>
