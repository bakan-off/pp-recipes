<link href="assets/styles.css" rel="stylesheet"/><link rel="manifest" href="manifest.webmanifest"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Сочная куриная грудка в китайском стиле с вельветингом","description":"Секрет китайских шеф-поваров: техника вельветинга (маринование с микро-щепоткой соды и кукурузным крахмалом) делает куриную грудку невероятно нежной, сочной и тающей во рту. Ресторанный высокобелковый стир-фрай с хрустящими овощами в ароматной глазури всего за 10 минут обжарки!","image":["https://bakan-off.github.io/pp-recipes/chinese-velvet-chicken.jpg"],"recipeCategory":"Основные блюда","keywords":"Высокобелковое, До 30 мин, Без сахара","recipeYield":"2 порций","nutrition":{"@type":"NutritionInformation","calories":"111 ккал на 100 г","proteinContent":"16 г","fatContent":"3 г","carbohydrateContent":"5.3 г"},"recipeIngredient":["Куриное филе (грудка) — 450 г (тонкими пластинками)","Пищевая сода — 1/3 ч. л. (~2 г, секрет сочности)","Соль и сухой куриный бульон — 1 ч. л. (по вкусу)","Кулинарное китайское вино (Шаосин) — 20 мл (1,5 ст. л. или сухое белое)","Соевый соус (в маринад) — 15 мл (1 ст. л.)","Кукурузный крахмал (в маринад) — 10 г (1 ч. л. с горкой)","Вода (для эмульсии крахмала) — 30 мл (2 ст. л.)","Болгарский перец (красный и жёлтый) — 200 г (брусочками)","Морковь — 100 г (тонкими слайсами)","Чеснок свежий — 3 зубчика (~12 г, измельчённый)","Растительное масло (для вока/сковороды) — 10 г (2 ч. л.)","Соевый соус (в соус) — 15 мл (1 ст. л.)","Уксус рисовый или яблочный 6% — 5 мл (1 ч. л.)","Кукурузный крахмал (для соуса) — 5 г (1/2 ч. л.)","Вода (для соуса) — 40 мл (~2,5 ст. л.)","Хлопья перца чили — 1/3 ч. л. (по вкусу)","Семена кунжута — 5 г (1 ч. л. для подачи)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Нарезка и основа маринада (вельветинг)","text":"Промойте и тщательно обсушите 450 г куриного филе бумажным полотенцем. Нарежьте грудку поперек волокон тонкими пластинками толщиной около 4–5 мм — так мясо гарантированно получится нежным и не волокнистым. Переложите кусочки в глубокую миску. Добавьте 1/3 ч. л. пищевой соды , 1 ч. л. соли с сухим куриным бульоном , 20 мл китайского вина Шаосин (или сухого белого) и 15 мл соевого соуса . Тщательно вымешивайте курицу руками в течение 1–2 минут: волокна мяса должны впитать жидкость и стать слегка липкими."},{"@type":"HowToStep","position":2,"name":"Запечатывание соков крахмалом и отдых 30 минут","text":"Всыпьте к курице 10 г кукурузного крахмала и влейте 30 мл холодной воды . Снова энергично вымесите мясо руками до образования гладкой эмульсии, которая тонкой бархатной плёнкой окутает каждый кусочек. Именно крахмальная плёнка вместе с содой удерживает влагу внутри мяса при контакте с раскалённой сковородой. Оставьте курицу мариноваться при комнатной температуре на 30 минут ."},{"@type":"HowToStep","position":3,"name":"Быстрая обжарка курицы на раскалённой сковороде","text":"Разогрейте глубокую сковороду или вок с 5 г растительного масла на максимальном огне до лёгкого дымка. Выложите замаринованное куриное филе в один слой. Обжаривайте 2–3 минуты , не перемешивая первые 30 секунд для фиксации корочки, затем быстро переверните и перемешайте лопаткой. Как только кусочки побелеют и станут упругими (оставаясь сочными внутри), сразу снимите их на тёплую тарелку. Не передерживайте курицу на сковороде!"},{"@type":"HowToStep","position":4,"name":"Обжарка овощей al dente и чеснока","text":"В ту же горячую сковороду добавьте оставшиеся 5 г масла. Выложите 200 г болгарского перца и 100 г моркови . Обжаривайте на максимальном огне 2–3 минуты , непрерывно потряхивая сковороду или перемешивая: овощи должны прогреться, но остаться хрустящими (al dente). Переложите овощи к курице. Убавьте огонь до среднего, бросьте в сковороду измельчённый чеснок ( 12 г ) и хлопья чили — прогрейте буквально 15–20 секунд до появления волшебного аромата."},{"@type":"HowToStep","position":5,"name":"Глазирование соусом и сборка блюда","text":"Заранее смешайте в чашке ингредиенты соуса: 15 мл соевого соуса , 5 мл рисового уксуса , 5 г кукурузного крахмала и 40 мл воды . Влейте смесь в сковороду к чесноку. При постоянном помешивании соус закипит и загустеет за 20–30 секунд , превратившись в прозрачную бархатистую глазурь. Сразу верните в сковороду курицу и овощи. Быстро перемешайте всё вместе в течение 30–40 секунд , чтобы соус равномерно покрыл каждый ломтик."},{"@type":"HowToStep","position":6,"name":"Подача с кунжутом","text":"Переложите горячий стир-фрай на сервировочное блюдо или в глубокий боул. Щедро посыпьте обжаренными семенами кунжута ( 5 г ) и свежей зеленью. Подавайте с отварным рисом или яичной лапшой, либо как самостоятельный низкоуглеводный белковый ужин. Приятного аппетита!"}]}</script></head>
