<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Творожно-овсяный ПП-хлеб в аэрогриле","description":"Ароматный цельнозерновой хлеб с хрустящей корочкой на овсяных отрубях и мягком твороге 0.1%. Доступно 2 выверенные вариации: классический плотный ржаной стиль и пышный пористый мякиш на псиллиуме.","image":["https://bakan-off.github.io/pp-recipes/oat-bran-bread.png"],"recipeCategory":"Выпечка","keywords":"Без добавленного сахара, Высокобелковое","recipeYield":"9 порций","nutrition":{"@type":"NutritionInformation","calories":"170 ккал на 100 г","proteinContent":"13.4 г","fatContent":"4.8 г","carbohydrateContent":"18.3 г"},"recipeIngredient":["Мягкий творог «Савушкин» 0.1% — 250 г (2 пачки по 125 г)","Яйца куриные С0 — 2 шт (~120 г) — подъем и объем","Овсяные отруби — 100 г","Кукурузный крахмал — 30 г (1.5 ст. л.)","Псиллиум (шелуха подорожника) — 5 г (1 ч. л. с горкой) — поры мякиша","Разрыхлитель теста — 1 ч. л. с горкой (5–6 г)","Яблочный уксус (или лимонный сок) — 1 ч. л. (5 мл) — активатор газа","Соль мелкая — 1 ч. л. без горки (5 г)","Специи: кориандр / тмин / чеснок — по 1/3 ч. л. (по вкусу)","Семена кунжута или льна (для верха) — 1/2 ч. л. (для посыпки)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Взбивание жидкой базы","text":"В глубокой миске взбейте вилкой или венчиком 2 яйца С0 с 1 ч. л. соли до появления легкой пенки. Добавьте 250 г творога «Савушкин» 0.1% и 1 ч. л. яблочного уксуса . Тщательно перемешайте до гладкой кремовой массы."},{"@type":"HowToStep","position":2,"name":"Введение отрубей, псиллиума и крахмала","text":"Всыпьте 100 г овсяных отрубей , 30 г кукурузного крахмала , 5 г псиллиума , 1 ч. л. с горкой разрыхлителя и хлебные специи (кориандр или тмин). Замесите лопаткой мягкое тесто."},{"@type":"HowToStep","position":3,"name":"Отдых и активация газов (5–7 минут)","text":"Оставьте тесто при комнатной температуре на 5–7 минут. Псиллиум свяжет свободную сыворотку, а уксус активирует разрыхлитель — в тесте образуется губчатая микропористая структура."},{"@type":"HowToStep","position":4,"name":"Формовка и выпечка (165°C, 30–35 мин)","text":"Выложите тесто в форму или сформируйте батончик на пергаменте, присыпьте семенами кунжута. За счет воздушных пор хлеб пропекается быстрее: выпекайте при 165°C в течение 30–35 минут . Шпажка из центра должна выходить сухой."},{"@type":"HowToStep","position":5,"name":"Остывание на решетке","text":"Переложите буханку на решетку и дайте полностью остыть 25–30 минут перед нарезкой. Мякиш стабилизируется и станет пружинящим, мягким и не прессованным!"}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
