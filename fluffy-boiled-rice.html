<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Идеальный рассыпчатый рис на воде (базовый рецепт)","description":"Базовая шпаргалка по варке риса методом полного впитывания (пропорция 1 : 1,5). Никакого сливания воды и вязкой каши — получается воздушно, зернышко к зернышку с первого раза.","image":["https://bakan-off.github.io/pp-recipes/fluffy-boiled-rice.jpg"],"recipeCategory":"Основные блюда","keywords":"Без добавленного сахара","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"116 ккал на 100 г","proteinContent":"2.2 г","fatContent":"0.2 г","carbohydrateContent":"25.5 г"},"recipeIngredient":["Рис белый сухой (длиннозерный, Жасмин, Басмати или круглозерный) — 200 г (1 стакан)","Вода холодная фильтрованная — 300 мл (1,5 стакана)","Соль — 0,5 ч. л. (по вкусу)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Промывка от лишнего крахмала (Обязательный шаг!)","text":"Если рис не промыть, поверхностный крахмал склеит его в вязкую кашу. Насыпьте 200 г (1 стакан) сухого риса в миску и залейте холодной водой. Помешайте рукой, слегка перетирая зерна — вода сразу станет белой и мутной. Слейте её и повторите промывку 4–5 раз , пока вода не станет почти прозрачной."},{"@type":"HowToStep","position":2,"name":"Закладка в кастрюлю (пропорция 1 : 1,5)","text":"Выберите кастрюлю с толстым дном и плотной крышкой. Пересыпьте промытый рис, влейте 300 мл (1,5 стакана) холодной воды и добавьте 0,5 ч. л. соли . Перемешайте ложкой один раз и разровняйте слой. ⚠️ Золотое правило: как только вода закипит, мешать рис ложкой больше НЕЛЬЗЯ до самого конца готовки (иначе зерна ломаются и выделяют крахмал)."},{"@type":"HowToStep","position":3,"name":"Закипание","text":"Поставьте кастрюлю на средний или сильный огонь (пока без крышки) и дождитесь момента, когда вода активно закипит по всей поверхности."},{"@type":"HowToStep","position":4,"name":"Томление под крышкой (12–15 минут)","text":"Как только вода закипела: плотно закройте кастрюлю крышкой и сразу убавьте огонь до самого минимума (на газу — минимальный огонек, на электроплите — 2–3 из 9, чтобы внутри едва-едва булькало). Засеките 12–15 минут . Крышку не поднимайте, чтобы не выпустить пар! За это время рис полностью впитает всю воду."},{"@type":"HowToStep","position":5,"name":"«Отдых» на пару без огня (10 минут)","text":"Выключите плиту (если плита электрическая и конфорка долго остывает — переставьте кастрюлю на холодную конфорку). НЕ открывайте крышку еще 10 минут! За это время пар внутри равномерно распределится, верхние зернышки дойдут до идеала, а нижние легко отойдут от дна."},{"@type":"HowToStep","position":6,"name":"Разрыхление вилкой и подача","text":"Откройте крышку и аккуратно взрыхлите готовый рис вилкой (именно вилкой, а не ложкой, чтобы не помять зерна). Рис получится воздушным и рассыпчатым — идеальный гарнир к мясу, курице или рыбе!"}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
