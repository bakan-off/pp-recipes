<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Шоколадно-сливочный чизкейк со сгущенкой","description":"Нежнейший шоколадно-карамельный десерт с бархатной трюфельной текстурой на 1% сгущенке и твороге 5%. Псиллиум удерживает влагу и дает стабильную шелковистую основу без грамма муки и крахмала.","image":["https://bakan-off.github.io/pp-recipes/chocolate-fudge-cheesecake.png"],"recipeCategory":"Десерты","keywords":"Высокобелковое","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"198 ккал на 100 г","proteinContent":"19.2 г","fatContent":"5.5 г","carbohydrateContent":"17 г"},"recipeIngredient":["Творог 5% («Моя цена») — 360 г (2 пачки)","Сгущенное молоко 1% — 170 г","Яйца куриные С0 — 2 шт (~120 г)","Сывороточный протеин (КСБ 80) — 45 г (1.5 скупа)","Какао-порошок («Золотой Ярлык») — 20 г (2 ст. л.)","Псиллиум (шелуха подорожника) — 5 г (1 ч. л.)","Заменитель сахара (ФитПарад) — 4 стика","Разрыхлитель теста — 1/2 ч. л. (~3 г)","Соль мелкая — щепотка"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Творожно-сгущеночная основа","text":"В чашу блендера выложите 360 г творога 5% , разбейте 2 яйца С0 и влейте 170 г 1% сгущенки . Пробейте погружным блендером 1–1.5 минуты до гладкого кремового состояния без комочков."},{"@type":"HowToStep","position":2,"name":"Ввод шоколада, протеина и псиллиума","text":"Добавьте 45 г протеина , 20 г какао «Золотой Ярлык» , 1 ч. л. псиллиума (5 г) , 4 стика ФитПарада , 1/2 ч. л. разрыхлителя и обязательную щепотку соли . Взбейте блендером до шелковистого шоколадного теста."},{"@type":"HowToStep","position":3,"name":"Активация псиллиума (2 минуты)","text":"Оставьте тесто постоять при комнатной температуре ровно 2 минуты. Псиллиум свяжет влагу, и тесто станет заметно более густым, шелковистым и послушным."},{"@type":"HowToStep","position":4,"name":"Выпекание в аэрогриле (160°C, 25–28 мин)","text":"Перелейте тесто в круглую форму диаметром 16–18 см (силиконовую или с пергаментом). Выпекайте в разогретом аэрогриле при 160°C ровно 25–28 минут . Верх схватится матовой шоколадной корочкой, а серединка останется нежной и слегка подвижной."},{"@type":"HowToStep","position":5,"name":"Охлаждение и стабилизация","text":"Выключите аэрогриль и оставьте чизкейк с приоткрытой чашей на 15 минут. Затем полностью остудите при комнатной температуре и уберите в холодильник на 2–3 часа (идеально на ночь). Десерт застынет в плотный, тающий шоколадный трюфель."}]}</script></head>
