<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Кремовый белковый скрэмбл с йогуртом «Теос»","description":"Нежнейший ресторанный омлет-скрэмбл с греческим йогуртом «Теос» (70 г) и молоком. Без сухой «резиновой» текстуры — тающие сливочные волны с гранулированным чесноком, свежим огурцом и колечками халапеньо.","image":["https://bakan-off.github.io/pp-recipes/egg-white-scramble.png"],"recipeCategory":"Завтраки","keywords":"Без добавленного сахара, До 20 мин, Кето","recipeYield":"1 порций","nutrition":{"@type":"NutritionInformation","calories":"58 ккал на 100 г","proteinContent":"9.1 г","fatContent":"1.4 г","carbohydrateContent":"2.2 г"},"recipeIngredient":["Яичные белки (С0 / С1) — 4 шт (145 г)","Греческий йогурт «Теос» 2% — 70 г (1/2 банки)","Молоко 1.5–2.5% — 35 г (2–3 ст. л.)","Масло растительное (распылитель) — 1–2 пшика (~1 г)","Соль мелкая — 1/3 ч. л. (по вкусу)","Сушеный чеснок гранулированный — 1/3 ч. л.","Черный свежемолотый перец — щепотка","Свежий огурец (для хрустящей подачи) — 50–70 г","Перец халапеньо (маринованный или свежий) — 10–15 г (по вкусу)","Свежая зелень (укроп или лук-шнитт) — 3–5 г"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Взбивание сливочной основы","text":"В глубокой миске соедините 4 яичных белка (145 г) , 70 г йогурта «Теос» , 35 г молока , соль, свежемолотый перец и сушеный чеснок. Взбейте вилкой или венчиком 30–40 секунд до гладкой кремовой массы без крупных комочков."},{"@type":"HowToStep","position":2,"name":"Подготовка сковороды","text":"Поставьте антипригарную сковороду на умеренно-средний огонь (важно не раскалять сковороду, чтобы белок не сгорел и не стал сухим). Сделайте 1–2 пшика масла из распылителя."},{"@type":"HowToStep","position":3,"name":"Формирование шелковистых волн","text":"Вылейте смесь на сковороду. Подождите 15–20 секунд, пока нижний слой чуть-чуть схватится. Затем силиконовой лопаткой плавно и непрерывно сдвигайте массу от краев к центру , собирая нежные сливочные складки."},{"@type":"HowToStep","position":4,"name":"Подача со свежим огурцом и халапеньо","text":"Готовьте скрэмбл суммарно не более 1.5–2 минут . Снимайте на тарелку, когда он еще слегка влажный и глянцевый : блюдо само дойдет до идеала за 30 секунд. Рядом выложите кружочки свежего огурца, колечки пикантного халапеньо и посыпьте свежей зеленью!"}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
