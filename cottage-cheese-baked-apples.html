<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Творожный крем с печёными яблоками и цветочным мёдом","description":"Шелковистый творожный крем с охлаждением в морозилке, тёплыми печёными яблоками из аэрогриля и цветочным мёдом. Высокобелковый проверенный десерт без муки и сахара-песка. 36.4 г белка на порцию!","image":["https://bakan-off.github.io/pp-recipes/cottage-cheese-baked-apples.jpg"],"recipeCategory":"Десерты","keywords":"Высокобелковое","recipeYield":"2 порций","nutrition":{"@type":"NutritionInformation","calories":"113.7 ккал на 100 г","proteinContent":"10.9 г","fatContent":"3 г","carbohydrateContent":"10.5 г"},"recipeIngredient":["Творог «Першино» 5% — 380 г","Творог мягкий «Савушкин» 0.1% — 125 г (1 стаканчик)","Яблоки без сердцевины (кубиками 1.5–2 см) — 300 г (кожуру можно оставить)","Цветочный мёд — 30 г (сразу в крем при взбивании)","ФитПарад №10 — 4 стика (по вкусу)","Корица молотая — щепотка (по желанию)","Вода питьевая — 10–15 г (только при необходимости)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Подготовить яблоки","text":"Вымыть яблоки, удалить сердцевины и отвесить 300 г съедобной части . Нарезать аккуратными кубиками размером 1,5–2 см (кожуру можно оставить для аромата и клетчатки)."},{"@type":"HowToStep","position":2,"name":"Выложить на пергамент в аэрогриле","text":"Дно корзины аэрогриля застелить листом пергамента. Выложить яблоки в один слой и по желанию посыпать щепоткой корицы. Масло, сахар и подсластители к яблокам не добавлять."},{"@type":"HowToStep","position":3,"name":"Запечь на пергаменте (170°C, 12–18 мин)","text":"Запекать в аэрогриле при 170°C примерно 12–18 минут прямо на пергаменте. Через 8–10 минут аккуратно перемешать. Яблоки должны стать мягкими внутри, с сухой аппетитной корочкой без лишней водянистости (усушка убирает лишнюю влагу, концентрируя яблочный вкус)."},{"@type":"HowToStep","position":4,"name":"Взбить крем и охладить в морозилке (10–15 мин)","text":"В глубокой чаше соединить: 380 г творога «Першино» 5% , 125 г мягкого творога «Савушкин» 0.1% (1 стаканчик), все 30 г цветочного мёда и 4 стика ФитПарада №10 . Тщательно пробить погружным блендером до абсолютно однородной шелковистой консистенции. Затем поставить чашу с кремом в морозилку на 10–15 минут — крем станет плотным, густым и ледяным, как подтаявшее сливочное мороженое."},{"@type":"HowToStep","position":5,"name":"Остудить печёные яблоки","text":"Пока крем стабилизируется в морозилке, дать печёным яблокам на пергаменте немного остыть: они должны быть приятно тёплыми, а не горячими."},{"@type":"HowToStep","position":6,"name":"Соединить яблоки с кремом и перемешать","text":"Достать охлажденный крем из морозилки. Переложить тёплые печёные яблоки прямо в чашу к крему и аккуратно перемешать лопаткой . Тёплые пряные яблочные кубики идеально объединятся с плотным ледяным творожным кремом в гармоничный десерт."},{"@type":"HowToStep","position":7,"name":"Подача (2 щедрые порции по 335 г)","text":"Разложить готовый десерт по двум креманкам или глубоким пиалам (получается ровно две порции по 335 г ). Подавать сразу — идеальный баланс прохладного сливочного крема и тёплых пряных яблок!"}]}</script></head>
