<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Шоколадно-вишневый ПП-чизкейк «Черный лес»","description":"Насыщенный вкус темного шоколада, терпкий вишневый аромат на сиропе без калорий, тающая кремовая текстура и рекордное содержание протеина при минимуме углеводов.","image":["https://bakan-off.github.io/pp-recipes/chocolate-cherry.png"],"recipeCategory":"Десерты","keywords":"Без добавленного сахара, Высокобелковое, До 20 мин","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"128 ккал на 100 г","proteinContent":"19.1 г","fatContent":"3.3 г","carbohydrateContent":"3.2 г"},"recipeIngredient":["Творог в брикете (0.1–2%) — 400 г (2 пачки)","Греческий йогурт или мягкий творог (0.1–2.5%) — 120 г (1 шт)","Яйца куриные С0 — 2 шт (~125 г)","Протеин КСБ-80 (без вкуса) — 30 г (1 скуп)","Какао-порошок (темный/алкализованный) — 20 г (~1.5 ст. л.)","Сироп 0 ккал «Вишня-Шоколад» — 50–60 мл","Заменитель сахара (ФитПарад) — 4–5 стиков","Псиллиум (шелуха) — 3 ч. л. с горкой (~15 г)","Соль мелкая — Щепотка"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Жидкая шоколадная база","text":"В чашу блендера выложите творог (400 г), греческий йогурт (120 г), 2 яйца С0, влейте 50–60 мл сиропа «Вишня-Шоколад» без сахара."},{"@type":"HowToStep","position":2,"name":"Взбивание с какао и протеином","text":"Добавьте 20 г какао-порошка, протеин (30 г), 4–5 стиков ФитПарада и щепотку соли. Пробейте блендером 2 минуты до шелковистого темно-шоколадного крема."},{"@type":"HowToStep","position":3,"name":"Введение псиллиума","text":"Всыпьте 3 ч. л. псиллиума, перемешайте лопаткой и оставьте на 5–7 минут для набухания и стабилизации массы."},{"@type":"HowToStep","position":4,"name":"Выпекание в аэрогриле","text":"Форму (диаметр 16–18 см) застелите пергаментом, выложите шоколадную массу. Выпекайте при 170°C в течение 20 минут ."},{"@type":"HowToStep","position":5,"name":"Охлаждение и подача","text":"Остудите до комнатной температуры и уберите в холодильник на 2–3 часа. При подаче полейте сверху 1 ложкой сиропа «Вишня-Шоколад»!"}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
