<link href="assets/styles.css" rel="stylesheet"/><link rel="manifest" href="manifest.webmanifest"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Белковый «Доширак» для похудения и набора мышц с курицей и овощами","description":"Легендарная ПП-версия лапши в одной сковороде: кусочки куриного филе в соево-чесночной глазури, сочные овощи, яичная лапша и белковый сливочно-горчичный соус на греческом йогурте вместо майонеза. Более 51 г белка на порцию!","image":["https://bakan-off.github.io/pp-recipes/protein-doshirak.jpg"],"recipeCategory":"Основные блюда","keywords":"Высокобелковое, До 20 мин, Без сахара","recipeYield":"2 порций","nutrition":{"@type":"NutritionInformation","calories":"108.1 ккал на 100 г","proteinContent":"11.6 г","fatContent":"1.5 г","carbohydrateContent":"11.6 г"},"recipeIngredient":["Куриное филе (грудка) — 300 г (кубиками)","Яичная лапша сушеная в гнёздах (не жаренная во фритюре) — 90 г (2 гнезда)","Замороженная овощная смесь — 400 г (1 упаковка)","Соевый соус — 20 мл (1,5 ст. л.)","Чеснок свежий — 2 зубчика (~8 г, на мелкой тёрке)","Специи (приправа для курицы, паприка, карри) — 1 ч. л. (по вкусу)","Вода (кипяток) — 350 мл (~1,5 стакана для тушения)","Греческий йогурт 2% («Теос» / Савушкин) — 100 г (основа соуса)","Горчица (дижонская или русская) — 1 ч. л. (~10 г)","Свежая зелень (зелёный лук, укроп) — 15 г (мелко нарубленная)","Растительное масло в спрее — 2 пшика (~1,5 г для сковороды)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Обжарка куриного филе в соево-чесночной глазури","text":"Нарежьте 300 г куриного филе небольшими аккуратными кубиками (примерно 2×2 см). Разогрейте глубокую сковороду или вок с антипригарным покрытием, сделав 1–2 легких пшика маслом из спрея. Выложите курицу и обжаривайте на средне-сильном огне 3–4 минуты . Добавьте 20 мл соевого соуса , натёртый на мелкой тёрке чеснок и специи (приправу для курицы, сладкую паприку и карри). Перемешайте — курица мгновенно покроется аппетитной ароматной глазурью."},{"@type":"HowToStep","position":2,"name":"Добавление овощей","text":"Всыпьте прямо к курице 400 г замороженной овощной смеси (размораживать заранее не нужно). Перемешайте и тушите всё вместе под приоткрытой крышкой на среднем огне около 4–5 минут , пока овощи не осядут и не пустят сок."},{"@type":"HowToStep","position":3,"name":"Томление яичной лапши под крышкой","text":"Выложите сухие брикеты/гнёзда яичной лапши ( 90 г, 2 гнезда ) прямо поверх овощей и курицы. Залейте 350 мл горячей воды (около 1,5 стакана) , чтобы лапша была почти погружена в бульон. Плотно накройте сковороду крышкой, убавьте огонь до умеренного и готовьте 5–7 минут . За 2 минуты до конца снимите крышку и аккуратно расправьте размягчённую лапшу вилкой или лопаткой, равномерно перемешивая её с курицей и овощами."},{"@type":"HowToStep","position":4,"name":"Приготовление белкового соуса («замена майонеза»)","text":"Пока лапша томится, приготовьте фирменный фитнес-соус: в небольшой ёмкости смешайте 100 г греческого йогурта 2% и 1 ч. л. горчицы (можно добавить микро-щепотку соли или пару капель соевого соуса). Соус получается шелковистым, нежным и кремовым — по вкусу неотличим от майонеза, но содержит чистый белок и минимум калорий."},{"@type":"HowToStep","position":5,"name":"Подача со сливочным соусом и зеленью","text":"Разложите горячую лапшу с курицей и овощами по глубоким боулам или тарелкам. Сверху выложите щедрую порцию греческого соуса и посыпьте свежей мелко нарезанной зеленью (зелёным луком и укропом). Перед едой перемешайте — горячий соус объединится с соками курицы и овощей в бархатистый сливочный крем. Приятного аппетита!"}]}</script></head>
