<link rel="manifest" href="manifest.webmanifest"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Творожный десерт с голубикой и варёной сгущёнкой","description":"Запечённый творожный десерт без коржа с густой голубичной прослойкой и варёной сгущенкой. Две вариации: шоколадно-ягодная и ягодная без шоколада. Готовится в духовке при 160 °C, без мучной основы и без крахмала в творожной основе.","image":["https://bakan-off.github.io/pp-recipes/tvorozhnyy-desert-golubika-sgushchonka.jpg"],"recipeCategory":"Десерты","keywords":"Белковый десерт, Без мучной основы, Творог, Голубика, Духовка","recipeYield":"8 порций","nutrition":{"@type":"NutritionInformation","calories":"135.1 ккал на 100 г","proteinContent":"14.1 г","fatContent":"3.3 г","carbohydrateContent":"12.5 г"},"recipeIngredient":["Обезжиренный творог (пачки по 180 г) — 540 г (3 пачки)","Мягкий творог «Ирбитский», 5% — 230 г (вся банка)","Яйца без скорлупы — 2 шт. (~100 г)","Варёная сгущёнка, 4% (в массу) — 40 г","Термостабильные тёмные шоколадные капли (в массу) — 15 г","Ванилин, соль, некалорийный подсластитель — по вкусу","Голубика замороженная — 200 г","Кукурузный крахмал (только в ягоды) — 10 г","Холодная вода для крахмальной смеси — 20–30 мл","Варёная сгущёнка, 4% (сверху) — 40 г","Термостабильные тёмные шоколадные капли (сверху) — 10 г"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Подготовка формы и духовки","text":"Используйте только жаропрочную стеклянную форму объёмом 1,5 л, подходящую для духовки. При желании застелите дно пергаментом. Маслом не смазывайте, чтобы сохранить приведённое КБЖУ. Запишите вес пустой формы. Разогрейте духовку до 160 °C, режим верх/низ, без конвекции, средний уровень. Следуйте инструкции производителя по прогреву стеклянной формы, чтобы избежать температурного перепада."},{"@type":"HowToStep","position":2,"name":"Ягодная начинка с крахмалом","text":"Положите 200 г замороженной голубики в сотейник. Нагревайте на слабом огне, помешивая, пока ягоды не оттают и не выделят сок; при необходимости добавьте ложку воды. Часть ягод слегка размять. В отдельной чашке размешайте 10 г кукурузного крахмала с 20–30 мл холодной воды (не тёплой и не горячей, иначе будут комки). Доведите ягоды до слабого кипения, влейте крахмальную смесь тонкой струйкой, постоянно помешивая, и проварите около 1 минуты до загустения. Снимите с огня и остудите до комнатной температуры. Начинка должна быть как густой соус, без водянистой лужицы."},{"@type":"HowToStep","position":3,"name":"Творожная основа с яйцами и шоколадом","text":"Соедините 540 г обезжиренного творога, 230 г мягкого творога «Ирбитский» 5%, 40 г варёной сгущёнки, ванилин и соль. Пробить погружным блендером до гладкой консистенции. До добавления яиц попробуйте на сладость и при необходимости добавьте некалорийный подсластитель. Вмешайте 2 яйца (~100 г без скорлупы), коротко перемешайте до однородности, без пышного взбивания. Лопаткой вмешайте 15 г шоколадных капель. Крахмал в творожную массу не добавляйте."},{"@type":"HowToStep","position":4,"name":"Сборка слоев в форме","text":"Выложите чуть больше половины творожной массы в форму. Распределите остывшую голубичную начинку, отступая примерно 1 см от стенок. Закройте оставшейся творожной массой, выкладывая её небольшими порциями и аккуратно разравнивая. Не заполняйте форму выше ¾–⅘ высоты. Сверху сделайте капли из оставшихся 40 г сгущёнки и посыпьте 10 г шоколадных капель."},{"@type":"HowToStep","position":5,"name":"Выпечка и проверка готовности","text":"Выпекайте около 60 минут при 160 °C. Проверьте цвет верха через 30–35 минут, готовность середины — начиная с 45-й минуты. Если сгущёнка и шоколад сверху быстро темнеют, неплотно прикрыть форму фольгой. Края должны схватиться, а середина слегка подрагивать единым участком, не плескаться. При измерении кухонным термометром температура в центре должна достичь не ниже 74 °C. Не ориентируйтесь на полностью сухую зубочистку: десерт остаётся влажным."},{"@type":"HowToStep","position":6,"name":"Остывание и охлаждение","text":"Поставьте форму на сухую термостойкую подставку. Не ставьте горячее стекло на холодную или мокрую поверхность. Дайте остыть примерно 45–60 минут; перед холодильником форма не должна оставаться горячей. Избегайте температурного шока и не храните десерт при комнатной температуре более 2 часов суммарно. Уберите в холодильник минимум на 4 часа, лучше на ночь. После охлаждения накрыть и нарезать холодным."}]}</script></head>
