<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Карамельно-сливочный ПП-чизкейк с лимонной ноткой","description":"Нежнейшая кремовая текстура сливочного пломбира, аромат сгущенного молока, благородная цитрусовая кислинка и рекордное содержание протеина для сушки и набора сухой мышечной массы.","image":["https://bakan-off.github.io/pp-recipes/cheesecake.png"],"recipeCategory":"Десерты","keywords":"Высокобелковое","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"145 ккал на 100 г","proteinContent":"16.3 г","fatContent":"3.7 г","carbohydrateContent":"10.9 г"},"recipeIngredient":["Творог «Красная цена» обезжиренный 0% — 360 г (2 пачки по 180 г)","Творог мягкий «Савушкин» 0.1% — 125 г (1 стаканчик)","Сгущенка вареная «Станция Молочная» 4% — 120 г (густая карамельная база)","Яйца куриные С0 (целиком) — 3 шт (~170 г) — сочность и нежность","Сывороточный протеин (КСБ 80 / без вкуса) — 45 г (1.5 скупа)","Псиллиум (шелуха подорожника) — 10 г (~2.5 ч. л.) — стабильность основы","Лимонная кислота — 1/4 ч. л. (в 1 ч. л. воды) — снять приторность","Заменитель сахара (ФитПарад №7/10) — 7 стиков (насыщенная десертная сладость)","Ванилин-интенсив Dr. Bakers — 1–2 г","Разрыхлитель теста — 1/2 ч. л. (~3 г)","Соль мелкая — щепотка (усиливает карамель)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Карамельная жидкая эмульсия","text":"В чашу блендера отправьте 125 г мягкого творога «Савушкин» , 3 яйца С0 целиком , 120 г вареной сгущенки 4% , 7 стиков ФитПарада , ванилин, щепотку соли и 1/4 ч. л. лимонной кислоты (предварительно растворенной в 1 ч. л. теплой воды). Пробейте погружным блендером 30 секунд до однородного карамельного крема."},{"@type":"HowToStep","position":2,"name":"Введение творога «Красная цена»","text":"Добавьте 2 пачки творога «Красная цена» 0% (360 г) . Тщательно пробейте погружным блендером 1.5–2 минуты. Масса должна стать шелковистой, глянцевой, красивого цвета топленого молока без творожных крупинок."},{"@type":"HowToStep","position":3,"name":"Протеин и разрыхлитель","text":"Всыпьте 45 г протеина КСБ 80 и 1/2 ч. л. разрыхлителя. Пробейте блендером еще 30 секунд до полного растворения сухих компонентов."},{"@type":"HowToStep","position":4,"name":"Псиллиум и гидратация (5–7 минут)","text":"Всыпьте 10 г псиллиума (~2.5 ч. л.) и аккуратно перемешайте силиконовой лопаткой. Оставьте постоять 5–7 минут при комнатной температуре. Псиллиум свяжет влагу обезжиренного творога и гарантирует монолитное сухое дно."},{"@type":"HowToStep","position":5,"name":"Выпекание в аэрогриле (160°C, 25–28 мин)","text":"Форму 16–18 см застелите пергаментом или смажьте каплей масла. Перелейте карамельную массу. Выпекайте при температуре 160°C в течение 25–28 минут . Из-за карамелизации сахаров варенки верхушка красиво подрумянится, а центр должен слегка подрагивать при покачивании."},{"@type":"HowToStep","position":6,"name":"Остывание и выдержка в холоде","text":"Оставьте на 15–20 минут в выключенном аэрогриле с приоткрытой чашей. Затем остудите при комнатной температуре и уберите в холодильник минимум на 4–5 часов (лучше на ночь) . Текстура станет нежной и плотной, как классический торт крем-брюле!"}]}</script></head>
