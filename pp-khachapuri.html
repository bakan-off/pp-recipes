<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"ПП-хачапури с сыром на сковороде (на 6 штук)","description":"Быстрые сырные лепешки с тягучей начинкой на белковом тесте из йогурта Teos 2% и высокобелкового сыра GENIfit. 96.4 г белка на всю партию из 6 штук!","image":["https://bakan-off.github.io/pp-recipes/pp-khachapuri-hero.jpg"],"recipeCategory":"Завтраки","keywords":"Высокобелковое, До 20 мин","recipeYield":"6 порций","nutrition":{"@type":"NutritionInformation","calories":"223.5 ккал на 100 г","proteinContent":"16.6 г","fatContent":"5.5 г","carbohydrateContent":"26.2 г"},"recipeIngredient":["Пшеничная мука в тесто — 180 г","Пшеничная мука на припыл — 20 г (для стола и скалки)","Греческий йогурт «Савушкин Teos» 2% — 250 г (1 банка)","Высокобелковый сыр GENIfit Protein — 180 г (1 пачка, натереть)","Соль мелкая — 1/3 ч. л. (по вкусу)","Растительное масло — пару капель (~3 г) для смазывания сковороды"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Замешивание белкового теста","text":"В глубокой миске соедините 180 г пшеничной муки , 250 г греческого йогурта «Савушкин Teos» 2% (целая банка) и щепотку соли. Тщательно перемешайте сначала ложкой, а затем вымешивайте руками 1–2 минуты до состояния мягкого эластичного колобка теста."},{"@type":"HowToStep","position":2,"name":"Подготовка сыра GENIfit и деление теста","text":"Натрите всю пачку высокобелкового сыра GENIfit (180 г) на тёрке (в пачке рекордные 56 г белка!). Готовый колобок теста разделите ножом или скребком на 6 равных частей (примерно по 70–72 г теста на кусочек)."},{"@type":"HowToStep","position":3,"name":"Формирование хачапури (мешочек и раскатка)","text":"Используйте 20 г муки для припыления рабочего стола и скалки. Раскатайте кусочек теста в тонкую круглую лепёшку. В центр выложите ровно 30 г натёртого сыра GENIfit. Заверните края теста к центру «мешочком» и плотно защипните. Переверните швом вниз, припылите скалку и аккуратно раскатайте с двух сторон в тонкую лепёшку толщиной около 5–7 мм."},{"@type":"HowToStep","position":4,"name":"Обжаривание на сковороде (2–3 мин с каждой стороны)","text":"Хорошо разогрейте антипригарную сковороду и смажьте парой капель растительного масла. Выложите хачапури и обжаривайте на среднем огне по 2–3 минуты с каждой стороны до аппетитной румяной корочки с подпалинами. Сыр внутри моментально плавится и тянется!"},{"@type":"HowToStep","position":5,"name":"Подача в горячем виде","text":"Подавайте хачапури сразу со сковороды горячими. В одной штуке — 16.1 г чистого белка , а в сытной порции из 2 штук — рекордные 32.1 г белка !"}]}</script></head>
