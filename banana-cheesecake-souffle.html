<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Банановый ПП-чизкейк суфле в аэрогриле","description":"Нежнейшая кремовая текстура суфле, натуральная сладость банана и идеальная плотность благодаря кукурузному крахмалу. Без лишней влаги в тесте. Всего 122 ккал на 100 г!","image":["https://bakan-off.github.io/pp-recipes/banana-souffle.png"],"recipeCategory":"Десерты","keywords":"Высокобелковое","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"122 ккал на 100 г","proteinContent":"15.7 г","fatContent":"2.6 г","carbohydrateContent":"8.7 г"},"recipeIngredient":["Творог обезжиренный («Красная цена» 0%) — 360 г (2 пачки)","Греческий йогурт («Простоквашино» 2%) — 235 г (1 банка)","Спелый банан — 1 шт (~110 г)","Яйца куриные С0 — 2 шт (~125 г)","Сывороточный протеин (ваниль/пломбир) — 30 г (1 скуп)","Кукурузный крахмал — 25–30 г (1.5–2 ст. л.)","Заменитель сахара (ФитПарад) — 5–6 стиков","Соль мелкая — щепотка","Сироп 0 ккал «Сгущенка» (для подачи) — топпинг по вкусу"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Закладка основы в блендер","text":"В чашу блендера выложите творог (360 г), банку греческого йогурта (235 г), нарезанный спелый банан и разбейте 2 яйца С0. Жидкий сироп в само тесто не добавляем, чтобы не переувлажнять массу!"},{"@type":"HowToStep","position":2,"name":"Добавление сухих компонентов и взбивание","text":"Всыпьте 30 г протеина, 25–30 г кукурузного крахмала, 5–6 стиков ФитПарада и щепотку соли (она балансирует вкус). Тщательно пробейте блендером 2–2.5 минуты до гладкой шелковистой текстуры без крупинок."},{"@type":"HowToStep","position":3,"name":"Подготовка формы","text":"Форму для запекания (диаметр 16–18 см) застелите пергаментом (дно и бортики). Аккуратно перелейте творожную массу и слегка постучите формой об стол, чтобы вышли крупные пузырьки."},{"@type":"HowToStep","position":4,"name":"Выпекание в аэрогриле","text":"Выпекайте при температуре 160–165°C в течение 26–28 минут . Умеренная температура позволяет тесту пропечься в глубину без пересушивания и подгорания верхушки."},{"@type":"HowToStep","position":5,"name":"Остывание и стабилизация в холоде","text":"Дайте чизкейку полностью остыть в форме при комнатной температуре, затем уберите в холодильник минимум на 3–4 часа . Кукурузный крахмал полностью стабилизирует влагу, создав нежнейшую текстуру суфле!"}]}</script></head>
