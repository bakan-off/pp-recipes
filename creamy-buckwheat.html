<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Томленая сливочная гречка в аэрогриле","description":"Нежнейшая, рассыпчатая и бархатистая гречневая каша на молоке 2.5% со сливочным маслом и эффектом томления в русской печи. Идеальный сочный гарнир к запеченной куриной грудке.","image":["https://bakan-off.github.io/pp-recipes/creamy-buckwheat-hero.jpg"],"recipeCategory":"Завтраки","keywords":"Без добавленного сахара","recipeYield":"3 порций","nutrition":{"@type":"NutritionInformation","calories":"132 ккал на 100 г","proteinContent":"4.8 г","fatContent":"3.5 г","carbohydrateContent":"19.5 г"},"recipeIngredient":["Гречневая крупа (ядрица) — 240 г (сухая)","Крутой кипяток (1-й этап) — 350 мл","Молоко 2.5% (горячее) — 350 мл","Соль мелкая / морская — 1 ч. л. без горки (~5 г)","Сливочное масло 82.5% — 15 г (по 5 г на чел)","Свежемолотый черный перец — 1/4 ч. л.","Лавровый лист (по желанию) — 1 шт"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Промывка и запаривание в кипятке (15–20 мин)","text":"240 г гречки промойте 2–3 раза холодной водой и полностью слейте влагу. Пересыпьте крупу в жаропрочную форму (объемом от 1.5 л), добавьте 1 ч. л. соли, черный перец и лавровый лист. Залейте 350 мл крутого кипятка и оставьте на столе на 15–20 минут. Зерна впитают воду, набухнут и начнут размягчаться."},{"@type":"HowToStep","position":2,"name":"Введение горячего молока 2.5%","text":"Подогрейте 350 мл молока 2.5% в микроволновке или ковшике почти до закипания (горячее молоко не остановит прогрев зерен). Влейте горячее молоко в форму прямо к набухшей гречке и аккуратно перемешайте лопаткой."},{"@type":"HowToStep","position":3,"name":"Герметичная запечатка фольгой в 2 слоя","text":"Плотно накройте форму двумя слоями фольги , тщательно обжав бортики вокруг емкости. Это критически важно: в аэрогриле мощный конвекционный обдув, без фольги верхние зерна высохнут, а под фольгой создается эффект томления в глиняном горшочке."},{"@type":"HowToStep","position":4,"name":"Томление в аэрогриле (165–170°C, 26–28 мин)","text":"Установите форму в корзину аэрогриля. Выпекайте при температуре 165–170°C в течение 26–28 минут . Умеренная температура предотвращает бурное закипание молока и позволяет крупе впитать всю молочную сливочность."},{"@type":"HowToStep","position":5,"name":"Дозревание на остаточном тепле и сливочное масло","text":"Достаньте форму из аэрогриля, не вскрывая фольгу , и оставьте на столе на 10–15 минут (в это время можно быстро запечь курочку!). Перед подачей снимите фольгу, удалите лавровый лист, положите 15 г сливочного масла и перемешайте. Каша получается бархатистой, рассыпчатой и нежной!"}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
