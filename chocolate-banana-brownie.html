<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Шоколадно-банановый брауни-чизкейк","description":"Влажный, тающий десерт с глубоким шоколадным вкусом какао «Золотой Ярлык», сладостью спелых бананов и нежной творожной основой. Овсяная мука с двойной порцией протеина надежно удерживают влагу без грамма пшеничной муки.","image":["https://bakan-off.github.io/pp-recipes/chocolate-banana-brownie.png"],"recipeCategory":"Десерты","keywords":"Без добавленного сахара, Высокобелковое","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"159 ккал на 100 г","proteinContent":"16.7 г","fatContent":"5.1 г","carbohydrateContent":"11.6 г"},"recipeIngredient":["Творог 5% («Моя цена») — 360 г (2 пачки)","Бананы спелые (очищенные) — 235 г (2 шт.)","Яйца куриные С0 — 2 шт (~120 г)","Сывороточный протеин (базовый + шоколадный) — 45 г (1 скуп + 1 ст. л.)","Какао-порошок («Золотой Ярлык») — 15 г","Овсяная мука — 25–30 г (1.5–2 ст. л.)","Заменитель сахара (ФитПарад) — 7 стиков","Разрыхлитель теста — 1/2 ч. л. (~3 г)","Соль мелкая — щепотка"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Бананово-яичная основа","text":"В чашу блендера поместите 2 очищенных банана (235 г) и разбейте 2 яйца С0 . Измельчите погружным блендером 20–30 секунд до однородного жидкого фруктового пюре."},{"@type":"HowToStep","position":2,"name":"Добавление творога и сухих компонентов","text":"Добавьте 360 г творога 5% , 45 г протеина (базовый КСБ + ложка шоколадного), 15 г какао «Золотой Ярлык» , 25–30 г овсяной муки , 7 стиков ФитПарада , 1/2 ч. л. разрыхлителя и обязательную щепотку соли ."},{"@type":"HowToStep","position":3,"name":"Взбивание до шелковистости","text":"Тщательно пробейте массу погружным блендером 1.5–2 минуты. Все творожные крупинки должны раствориться. Тесто станет густым, глянцевым и насыщенно-шоколадным."},{"@type":"HowToStep","position":4,"name":"Выпекание в аэрогриле (160–165°C, 26–28 мин)","text":"Перелейте массу в силиконовую форму (d=16–18 см) или форму с пергаментом. Выпекайте при температуре 160–165°C ровно 26–28 минут . Верх схватится ровной корочкой, а серединка останется нежной и слегка подвижной."},{"@type":"HowToStep","position":5,"name":"Охлаждение и стабилизация","text":"Дайте десерту полностью остыть при комнатной температуре, затем уберите в холодильник на 2–3 часа (идеально на ночь). Овсяная клетчатка свяжет остаточную влагу, и пирог приобретет эталонную плотную текстуру настоящего шоколадного брауни."}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
