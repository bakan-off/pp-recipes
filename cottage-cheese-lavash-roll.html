<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Высокобелковый творожный рулет в лаваше","description":"Хрустящий рулет из тонкого лаваша с нежным творожным кремом, сочной грушей и голубикой под кунжутной корочкой. Более 108 г белка на весь рулет!","image":["https://bakan-off.github.io/pp-recipes/cottage-cheese-lavash-roll.jpg"],"recipeCategory":"Выпечка","keywords":"Высокобелковое, Выпечка, Без сахара","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"106.3 ккал на 100 г","proteinContent":"13.1 г","fatContent":"1.4 г","carbohydrateContent":"9 г"},"recipeIngredient":["Творог 0% (обезжиренный) — 540 г (3 пачки по 180 г)","Яйца куриные С1 — 2 шт. (1 яйцо + 1 белок в начинку, 1 желток на смазывание)","Тонкий лаваш — 100 г (1 большой лист)","Груша спелая (кубиками) — 120 г (1 шт.)","Голубика свежая — 60 г","Ванилин — щепотка (для аромата)","Подсластитель (ФитПарад №7/№10) — 4-5 стиков (по вкусу)","Семена кунжута — 5 г (для посыпки)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Приготовление творожного крема","text":"В глубокую чашу или блендер выложите 540 г творога 0% (3 пачки). Разбейте 2 яйца, предварительно отделив один желток в отдельную чашку (он понадобится позже для смазывания). Добавьте щепотку ванилина и 4–5 стиков подсластителя . Тщательно взбейте блендером до однородной кремовой консистенции."},{"@type":"HowToStep","position":2,"name":"Распределение начинки по лавашу","text":"Разложите на столе лист тонкого лаваша (100 г). Равномерно распределите творожную массу по всей поверхности, оставляя 2–3 см с одного края свободными. Сверху посыпьте нарезанными кубиками груши (120 г) и ягодами голубики (60 г)."},{"@type":"HowToStep","position":3,"name":"Сворачивание рулета","text":"Аккуратно и достаточно плотно сверните лаваш в рулет, стараясь не порвать тесто и аккуратно прижимая начинку."},{"@type":"HowToStep","position":4,"name":"Смазывание желтком и кунжут","text":"Переложите рулет на противень, застеленный пергаментной бумагой (швом вниз). Смажьте поверхность отложенным желтком и посыпьте 5 г семян кунжута ."},{"@type":"HowToStep","position":5,"name":"Выпекание при 180 °C (30 минут)","text":"Отправьте противень в разогретую до 180 °C духовку на 30 минут до золотистой румяной корочки. Перед нарезкой дайте рулету постоять 10–15 минут, чтобы крем стабилизировался."}]}</script></head>
