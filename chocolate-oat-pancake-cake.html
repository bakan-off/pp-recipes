акао-порошка (~5 г) . Тщательно размешайте венчиком без комочков и оставьте тесто на 15 минут , чтобы овсянка набухла."},{"@type":"HowToStep","position":2,"name":"Выпекание тонких шоколадных блинчиков (12 минут)","text":"Разогрейте антипригарную сковороду (диаметром 18–20 см) и слегка смажьте её парой капель масла перед первым блином. Наливайте тесто половником, распределяя тонким слоем, и выпекайте блинчики с двух сторон на среднем огне по 1–1,5 минуты до румяности. Сложите готовые блинчики стопкой и дайте им остыть."},{"@type":"HowToStep","position":3,"name":"Приготовление гладкого заварного крема (5 минут)","text":"В сотейнике соедините 200 мл молока , щепотку соли, сахарозаменитель, 1 ст. л. с горкой кукурузного крахмала (~8 г) и 1 яйцо , активно взбейте венчиком до однородности. Поставьте на небольшой огонь и варите при постоянном помешивании венчиком 3–4 минуты до загустения. Как только крем станет густым и глянцевым, снимите с плиты и слегка остудите."},{"@type":"HowToStep","position":4,"name":"Сборка торта и подача с какао","text":"Выложите первый блинчик на тарелку и равномерно смажьте порцией тёплого заварного крема. Чередуйте блинчики и крем, собирая высокий многослойный торт. Верхний слой украсьте какао-порошком через мелкое ситечко. На 100 г готового торта выходит всего 120 ккал (Б: 6,4 г | Ж: 3,8 г | У: 15,5 г)!"}]}</script></head>
