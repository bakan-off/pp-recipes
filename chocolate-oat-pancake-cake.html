 концентрата «Первый Русский Протеин» ( 129 ккал, 24 г белка, 2,7 г жиров и 2,1 г углеводов по этикетке). Взбейте 1 целое яйцо С0 и 100 г яичного белка с сахарозаменителем и 150 мл молока 2,5% . Всыпьте перемолотую в муку овсянку ( 60 г ), порцию протеина ( 30 г — при желании можно всыпать 20 г в тесто, а 10 г оставить из этой же ложки в крем), какао ( 6 г ) и разрыхлитель ( 2 г ). Влейте оставшиеся 150 мл молока 2,5% , размешайте венчиком и оставьте на 10–12 минут ."},{"@type":"HowToStep","position":2,"name":"Выпечка эластичных белковых блинчиков на сухой сковороде (12 минут)","text":"Выпекайте тонкие блинчики на разогретой антипригарной сковороде без капли масла на среднем огне (по 45–60 секунд с первой стороны и 20–30 секунд со второй). На молоке 2,5% блинчики получаются особенно нежными, сливочными и не рвутся при переворачивании."},{"@type":"HowToStep","position":3,"name":"Творожно-заварной крем «Дипломат» с «Савушкин» 0,1% (6 минут)","text":"В сотейнике смешайте 150 мл молока 2,5% , 1 яичный белок (35 г) , 8 г кукурузного крахмала , сахарозаменитель и ванилин, заварите на слабом огне 3 минуты при помешивании венчиком до загустения. Снимите с плиты, дайте остыть 3 минуты и вмешайте венчиком баночку мягкого творога «Савушкин» 0,1% ( 125 г ) — получится густой пломбирный крем."},{"@type":"HowToStep","position":4,"name":"Сборка торта и подача","text":"Смажьте каждый блинчик густым кремом и присыпьте верхушку оставшимся какао ( 2 г ) через ситечко. При той же калорийности, что у оригинала ( 851 ккал на весь торт), белка здесь почти в 2 раза больше — 81,4 г (на 100 г: 109 ккал, 10,4 г белка, 3,3 г жира и 9,1 г углеводов )!"}]}</script></head>
