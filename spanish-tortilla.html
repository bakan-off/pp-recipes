<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Испанская тортилья с картофелем и лёгким сыром (Tortilla de patatas)","description":"ПП-версия легендарной испанской тортильи: тонкие ломтики картофеля, томлёный лук, нежная яично-белковая заливка и тягучий расплавленный сыр. Сытное высокобелковое блюдо всего на паре капель масла.","image":["https://bakan-off.github.io/pp-recipes/spanish-tortilla.jpg"],"recipeCategory":"Завтраки","keywords":"Высокобелковое, Без сахара","recipeYield":"2 порций","nutrition":{"@type":"NutritionInformation","calories":"113.8 ккал на 100 г","proteinContent":"8.4 г","fatContent":"4.2 г","carbohydrateContent":"10 г"},"recipeIngredient":["Картофель — 260 г (2 средние шт.)","Репчатый лук — 70 г (1/2–1 шт.)","Яйца куриные С1 — 2 шт. (~110 г)","Яичные белки — 100 г (пастеризованные или от 3 яиц)","Сыр лёгкий 15–20% (тёртый) — 40 г (по вкусу)","Растительное масло в спрее — 4 г (пара пшиков для жарки)","Соль — 0,5 ч. л. (по вкусу)","Чёрный молотый перец — по вкусу"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Подготовка картофеля и лука","text":"Очистите картофель (2 шт., ~260 г) и нарежьте его аккуратными тонкими ломтиками толщиной 2–3 мм (можно воспользоваться тёркой-мандолиной или острым ножом). Репчатый лук нарежьте тонкими перьями или полукольцами."},{"@type":"HowToStep","position":2,"name":"Обжарка на минимальном масле","text":"Сбрызните антипригарную сковороду (диаметром 20–22 см) парой пшиков растительного масла. Выложите ломтики картофеля и лук, посолите щепоткой соли и обжаривайте на среднем огне под крышкой 8–10 минут, периодически аккуратно помешивая лопаткой, пока картофель не станет мягким и слегка золотистым."},{"@type":"HowToStep","position":3,"name":"Взбивание яично-белковой смеси","text":"В глубокой миске соедините 2 целых яйца и 100 г яичных белков. Слегка взбейте вилкой до однородного состояния (без густой пены), добавьте щепотку соли и свежемолотый чёрный перец по вкусу."},{"@type":"HowToStep","position":4,"name":"Заливка и томление под крышкой","text":"Разровняйте картофель с луком ровным слоем по дну сковороды. Равномерно залейте подготовленной яичной смесью. Убавьте огонь до минимума, плотно накройте сковороду крышкой и томите примерно 5–7 минут, пока яйца снизу и по краям не схватятся, а верх останется слегка влажным."},{"@type":"HowToStep","position":5,"name":"Переворачивание с помощью тарелки","text":"Снимите крышку и накройте сковороду плоской широкой тарелкой подходящего диаметра. Уверенным быстрым движением переверните сковороду с тарелкой. Затем аккуратно сдвиньте тортилью подрумяненной стороной вверх обратно на сковороду."},{"@type":"HowToStep","position":6,"name":"Сырная корочка и подача","text":"Сразу щедро посыпьте горячую поверхность тортильи 40 г лёгкого тёртого сыра. Снова накройте крышкой на 2–3 минуты на самом слабом огне: сыр расплавится в аппетитную тягучую шапочку, а нижняя сторона идеально пропечется. Подавайте горячей или тёплой, нарезав аппетитными треугольными сегментами."}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
