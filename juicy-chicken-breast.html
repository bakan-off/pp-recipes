<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Сочная куриная грудка в собственном соку (1 кг)","description":"Проверенный метод запекания сразу 1 кг филе в 2 слоя на сплошном пергаменте. Ровно 24 минуты при 200°C (4 захода по 6 минут с перемешиванием). Мясо не пересыхает, томится в соке и остается мягким!","image":["https://bakan-off.github.io/pp-recipes/juicy-chicken-breast.png"],"recipeCategory":"Основные блюда","keywords":"Без добавленного сахара, Высокобелковое, Кето","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"158 ккал на 100 г","proteinContent":"31.5 г","fatContent":"2.5 г","carbohydrateContent":"0.2 г"},"recipeIngredient":["Куриное филе (грудка) — 1 кг (1000 г)","Растительное / оливковое масло — 1–1.5 ч. л. (7–10 г)","Паприка сладкая или копченая — 1.5–2 ч. л.","Сушеный чеснок гранулированный — 1–1.5 ч. л.","Соль мелкая — 1 ч. л. без горки (~6 г)","Черный свежемолотый перец — 0.5 ч. л.","Прованские травы / хмели-сунели — 1 ч. л. (по вкусу)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Нарезка 1 кг филе","text":"Промойте 1 кг куриного филе, тщательно обсушите бумажными полотенцами и нарежьте кубиками размером 2.5–3 см."},{"@type":"HowToStep","position":2,"name":"Маринование со специями","text":"В большой миске смешайте все кусочки с 1–1.5 ч. л. масла, паприкой, сушеным чесноком, солью, перцем и травами. Хорошо перемешайте руками, чтобы специи распределились по всей массе мяса."},{"@type":"HowToStep","position":3,"name":"Выкладка в 2 слоя на пергамент","text":"На дно корзины аэрогриля выстелите сплошной пергамент (без перфорации!) с бортиками. Высыпьте все мясо — за счет объема (1 кг) оно ляжет в 2 слоя . Это ключевой фактор сочности: выделяющийся сок создаст эффект нежного томления!"},{"@type":"HowToStep","position":4,"name":"Запекание «4 по 6» (24 мин на 200°C)","text":"Выпекайте при температуре 200°C ровно 24 минуты . Каждые 6 минут выдвигайте корзину и тщательно перемешивайте слои лопаткой, чтобы нижние и верхние кусочки менялись местами."},{"@type":"HowToStep","position":5,"name":"Результат: сочность и запас на дни вперед","text":"Первые 12 минут мясо томится в собственном ароматном бульоне, а во второй половине времени сок выпаривается и карамелизуется, глазируя кусочки. Мясо остается нежнейшим! Идеальный запас белка на 3–4 дня вперед."}]}</script></head>
