<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Сливочная курочка с картофелем в аэрогриле","description":"Золотистый запеченный картофель, нежнейшее куриное филе в шелковистом чесночном крем-соусе с пармезаном и тянущейся моцареллой. Идеальный сытный рацион для набора сухой массы и дефицита калорий.","image":["https://bakan-off.github.io/pp-recipes/creamy-chicken-potatoes.png"],"recipeCategory":"Основные блюда","keywords":"Без добавленного сахара, Высокобелковое","recipeYield":"4 порций","nutrition":{"@type":"NutritionInformation","calories":"138 ккал на 100 г","proteinContent":"15 г","fatContent":"4.5 г","carbohydrateContent":"9.1 г"},"recipeIngredient":["Куриное филе (грудка) — 800 г","Картофель (очищенный) — 800 г","Творожный сыр Hochland — 140 г (1 баночка)","Пармезан тёртый — 40–50 г","Моцарелла для пиццы — 50–60 г","Молоко 1.5–2.5% — 120–150 мл","Сухой чеснок и паприка — по 1 ч. л.","Соль, перец, травы — по вкусу","Свежая петрушка — для подачи"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Запекание картофеля в аэрогриле","text":"Картофель нарежьте кубиками, смешайте с солью, паприкой и чесноком. Запекайте в аэрогриле при 195–200°C 18–20 минут до золотистой корочки."},{"@type":"HowToStep","position":2,"name":"Сочное филе на пергаменте","text":"Куриное филе нарежьте кубиками, обваляйте в специях с 1 ч. л. масла. Застелите чашу аэрогриля пергаментом, выложите мясо и запекайте 14–16 минут при 185–190°C в собственном соку."},{"@type":"HowToStep","position":3,"name":"Варка сливочно-сырного соуса","text":"В кастрюлю на плите влейте молоко (120–150 мл), выложите творожный сыр Hochland и 40–50 г пармезана. На слабом огне помешивайте 1.5–2 минуты до получения густого гладкого крема."},{"@type":"HowToStep","position":4,"name":"Сборка и пропитка блюда","text":"Переложите горячую курицу в кастрюлю вместе со всем соком с пергамента , всыпьте картофель и тщательно перемешайте лопаткой, чтобы соус обволок каждый кусочек."},{"@type":"HowToStep","position":5,"name":"Сырная шапка и подача","text":"Посыпьте поверхность моцареллой (50–60 г), накройте кастрюлю крышкой на 4–5 минут на выключенной плите до расплавления сыра. При подаче украсьте свежей петрушкой!"}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
