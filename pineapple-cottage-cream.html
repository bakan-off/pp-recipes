<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Творожно-ананасовый десертный крем (на 2 порции)","description":"Нежнейший высокобелковый десертный крем из обезжиренного творога и сочных кусочков ананаса. Почти 110 г чистого белка на весь десерт и практически 0 г жира!","image":["https://bakan-off.github.io/pp-recipes/pineapple-cottage-cream.jpg"],"recipeCategory":"Десерты","keywords":"Высокобелковое, До 20 мин, Без сахара","recipeYield":"2 порций","nutrition":{"@type":"NutritionInformation","calories":"71 ккал на 100 г","proteinContent":"10.4 г","fatContent":"0 г","carbohydrateContent":"7.4 г"},"recipeIngredient":["Творог «Красная цена» 0% — 540 г (3 пачки по 180 г)","Мягкий творог «Савушкин» 0.1% — 125 г (1 баночка)","Ананасы консервированные кусочками (кольца) — 340 г (чистый вес фруктов из банки)","Ананасовый сироп/сок из банки — 50 г (~3-4 ст. л. для взбивания)","Подсластитель (ФитПарад №7 или №10) — 4-5 стиков (по вкусу)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Подготовка творожной основы","text":"В глубокую чашу или миску выложите 540 г творога «Красная цена» 0% (3 пачки) и 125 г мягкого творога «Савушкин» 0.1% . Добавьте 4–5 стиков подсластителя ."},{"@type":"HowToStep","position":2,"name":"Добавление сока ананаса для взбивания","text":"Влейте к творогу 50 г (3–4 ст. л.) ананасового сиропа/сока прямо из банки. Это важный шаг: плотный брикетный творог 0% благодаря сиропу и мягкому творогу моментально пробьется блендером в нежнейший однородный шелковистый крем без крупинок."},{"@type":"HowToStep","position":3,"name":"Взбивание блендером","text":"Тщательно взбейте массу погружным блендером на высокой скорости в течение 1,5–2 минут до абсолютно гладкой, легкой и пышной кремовой консистенции."},{"@type":"HowToStep","position":4,"name":"Нарезка ананасов и смешивание","text":"Извлеките 340 г ананасов (кольца из банки) и нарежьте их аккуратными небольшими кусочками-кубиками. Добавьте нарезанные ананасы в чашу к творожному крему и аккуратно перемешайте лопаткой, равномерно распределяя сочные кусочки по всему объему."},{"@type":"HowToStep","position":5,"name":"Охлаждение и стабилизация (10-15 мин)","text":"Поставьте чашу с десертом в морозилку на 10–15 минут (или в холодильник на 30 минут). За это время крем станет плотнее, приобретет структуру тающего прохладного пломбира, а аромат ананаса раскроется ярче."},{"@type":"HowToStep","position":6,"name":"Подача на две порции","text":"Разложите готовый десерт по двум креманкам или глубоким чашам (примерно по 525–530 г на порцию ). В каждой порции — рекордные 54.9 г чистого белка при минимуме калорий!"}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
