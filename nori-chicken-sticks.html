<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"«Японские семечки» — хрустящие куриные палочки в нори","description":"Хрустящие мини-трубочки из водорослей нори с сочной начинкой из куриного фарша, зеленого лука, чеснока и кунжутного масла. 77 г белка и почти ноль углеводов!","image":["https://bakan-off.github.io/pp-recipes/nori-chicken-sticks.jpg"],"recipeCategory":"Основные блюда","keywords":"Высокобелковое, До 20 мин, Без сахара","recipeYield":"2 порций","nutrition":{"@type":"NutritionInformation","calories":"182.4 ккал на 100 г","proteinContent":"25 г","fatContent":"8 г","carbohydrateContent":"2.3 г"},"recipeIngredient":["Куриный фарш (из филе грудки / нежирный) — 300 г","Листы нори — 3-4 шт. (~10 г)","Зелёный лук — небольшой пучок (~20 г)","Чеснок — 2 зубчика (~8 г)","Кунжутное масло (или альтернативы) — 1 ст. л. (замены в шаге 1)","Яичный желток — 1 шт. (для смазывания и склейки нори)","Семена кунжута — 5 г (для посыпки)","Растительное масло в спрее — пару пшиков (~2 г)","Соль, чёрный молотый перец — по вкусу","Любимый соус (сырный, спайси или кисло-сладкий) — для подачи по вкусу"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Подготовка куриного фарша и ароматных добавок","text":"Мелко нарежьте зеленый лук и порубите или пропустите через пресс 2 зубчика чеснока. В глубокую миску положите 300 г куриного фарша , добавьте лук, чеснок, соль, черный перец по вкусу и влейте 1 столовую ложку кунжутного масла . 💡 Чем заменить кунжутное масло, если его нет: • Вариант с соевым соусом: 1 ч. л. обычного растительного масла + 1 ст. л. соевого соуса (в этом случае обычной соли добавьте чуть меньше). Дает яркий азиатский вкус умами. • Лайт-вариант без масла: 1–1.5 ст. л. ледяной воды или 1 ст. л. соевого соуса без масла. Хорошо вымесите фарш — мясо удержит влагу и останется сочным внутри даже без капли масла. Тщательно перемешайте фарш до плотной однородной массы."},{"@type":"HowToStep","position":2,"name":"Формирование полосок","text":"Для удобства и ровной формы переложите фарш в кулинарный мешок (или плотный пакетик со срезанным уголком). Лист нори разрежьте пополам. Вдоль длинного края полоски нори выдавите аккуратную полоску фарша толщиной с палец."},{"@type":"HowToStep","position":3,"name":"Сворачивание и нарезка","text":"Оставшуюся свободную часть листа нори смажьте взбитым яичным желтком с помощью кисти — желток намертво склеит шов и придаст золотистый блеск. Плотно сверните нори с фаршем в ровную длинную трубочку. Кулинарными ножницами разрежьте каждую получившуюся трубочку на 4 равные части ."},{"@type":"HowToStep","position":4,"name":"Подготовка к запеканию","text":"Выложите трубочки на решетку аэрогриля (или на противень, застеленный пергаментом). Слегка сбрызните растительным маслом из спрея и посыпьте семенами кунжута."},{"@type":"HowToStep","position":5,"name":"Запекание до хрустящей корочки","text":"В аэрогриле: запекайте при 200 °C примерно 10 минут , пару раз встряхнув корзину для идеального равномерного хруста. В духовке: запекайте при 200 °C около 10–12 минут . Подавайте горячими с любимым сырным, спайси или кисло-сладким соусом!"}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
