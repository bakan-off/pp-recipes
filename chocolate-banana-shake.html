<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Шоколадно-банановый протеиновый милкшейк","description":"Густой сливочно-шоколадный коктейль с бархатной текстурой растаявшего мороженого. Молоко 2.5%, спелый банан, какао и чистый сывороточный протеин. Взбивается погружным блендером прямо в шейкере без лишней посуды!","image":["https://bakan-off.github.io/pp-recipes/chocolate-banana-shake.png"],"recipeCategory":"Напитки","keywords":"Без добавленного сахара, До 20 мин","recipeYield":"1 порций","nutrition":{"@type":"NutritionInformation","calories":"94.4 ккал на 100 г","proteinContent":"8.9 г","fatContent":"2.4 г","carbohydrateContent":"9.6 г"},"recipeIngredient":["Молоко 2.5% (охлажденное) — 250 мл","Спелый банан — 1 шт. (~100 г)","Сывороточный протеин КСБ 80 — 30 г (1 скуп)","Какао «Золотой Ярлык» — 10–12 г (1 ст. л. с горкой)","Заменитель сахара (ФитПарад) — 1–2 стика (по вкусу)","Корица или ванилин — щепотка (по желанию)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Подготовка шейкера и молоко первым","text":"Возьмите чистый шейкер, выньте из него сетку и пружинный шарик (чтобы не задеть их ножами блендера). Налейте на дно 250 мл холодного молока 2.5% . Наливать молоко первым обязательно, чтобы сухие порошки не налипли на сухое дно."},{"@type":"HowToStep","position":2,"name":"Закладка банана и сухих компонентов","text":"Очистите банан, разломите его руками на 3–4 части и опустите в молоко. Сверху добавьте 30 г сывороточного протеина , 1 ст. л. какао «Золотой Ярлык» и 1–2 стика ФитПарада ."},{"@type":"HowToStep","position":3,"name":"Взбивание погружным блендером (30 секунд)","text":"Опустите ножку погружного блендера прямо в шейкер до самого дна. Включите среднюю скорость и взбивайте 25–35 секунд круговыми и приподнимающими движениями. Банан полностью разобьется в крем, а молоко с протеином взобьется в густую бархатистую пену."},{"@type":"HowToStep","position":4,"name":"Подача и наслаждение","text":"Коктейль готов! Пейте прямо из шейкера (ноль лишней грязной посуды) или перелейте в высокий стеклянный бокал с трубочкой. Сверху можно присыпать щепоткой какао или корицы."}]}</script></head>
