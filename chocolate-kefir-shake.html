<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Шоколадный протеиновый био-шейк на кефире","description":"Густой, кремовый шоколадный шейк на 1% кефире с чистым сывороточным протеином и классическим какао «Золотой Ярлык». Без сахара, с легкой сливочной кислинкой и бархатистой пенкой. Готовится в шейкере за 2 минуты!","image":["https://bakan-off.github.io/pp-recipes/chocolate-kefir-shake.png"],"recipeCategory":"Напитки","keywords":"Без добавленного сахара, Высокобелковое, До 20 мин","recipeYield":"1 порций","nutrition":{"@type":"NutritionInformation","calories":"82.6 ккал на 100 г","proteinContent":"11.6 г","fatContent":"1.7 г","carbohydrateContent":"4.4 г"},"recipeIngredient":["Кефир 1% («Ирбитский» или легкий биокефир) — 250 г","Сывороточный протеин КСБ (без добавок) — 30 г (1 мерный скуп)","Какао-порошок («Золотой Ярлык») — 7 г (десертная ложка)","Подсластитель (ФитПарад №7/№10) — 2–3 стика (по вкусу)","Ванилин (по желанию) — щепотка"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Жидкая основа — первой","text":"Налейте на дно чистого сухого шейкера ровно 250 г охлажденного 1% кефира . Заливать жидкость первой обязательно: если насыпать сухие порошки на сухое дно, они прилипнут к пластику и останутся неразмешанными."},{"@type":"HowToStep","position":2,"name":"Закладка сухих ингредиентов","text":"Поверх кефира засыпьте 30 г сывороточного протеина без добавок, ровно 7 г какао «Золотой Ярлык» и 2–3 стика сахарозаменителя . По желанию добавьте щепотку ванилина для аромата домашней выпечки."},{"@type":"HowToStep","position":3,"name":"Взбивание в шейкере (30–45 сек)","text":"Обязательно установите в шейкер сетку-рассекатель или опустите металлический пружинный шарик. Плотно закрутите крышку и защелкните питьевой клапан. Энергично взбалтывайте 30–45 секунд : сначала вертикальными амплитудными движениями, затем круговыми."},{"@type":"HowToStep","position":4,"name":"Оседание пены и подача","text":"Дайте шейкеру спокойно постоять 1–2 минуты . При взбивании сывороточный протеин образует объемную воздушную пенку — за минуту она осядет в плотную бархатистую сливочно-шоколадную шапку. Пейте сразу из шейкера или перелейте в охлажденный бокал!"}]}</script></head>
