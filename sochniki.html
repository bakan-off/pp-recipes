<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Творожные ПП-сочники с нежной начинкой","description":"Пластичное творожное тесто на цельнозерновой муке с тающей ванильной начинкой. Легко раскатывается скалкой, не крошится в песок и складывается полумесяцем без трещин. 15 г чистого белка на один сочник!","image":["https://bakan-off.github.io/pp-recipes/sochniki.png"],"recipeCategory":"Выпечка","keywords":"Без добавленного сахара, Высокобелковое","recipeYield":"8 порций","nutrition":{"@type":"NutritionInformation","calories":"188 ккал на 100 г","proteinContent":"16.1 г","fatContent":"5.7 г","carbohydrateContent":"17.5 г"},"recipeIngredient":["Творог 5% в брикетах — 360 г (2 пачки)","Яйцо куриное С0 (целиком) — 1 шт.","Мука цельнозерновая пшеничная — 150–160 г","Разрыхлитель теста — 1 ч. л. (5 г)","Заменитель сахара (ФитПарад) — 4–5 саше (по вкусу)","Соль мелкая — щепотка","Молоко 2.5% (если творог сухой) — 1–2 ст. л.","Творог 5% в брикетах — 180 г (1 пачка)","Яичный белок С0 (от 2-го яйца) — 1 шт.","Кукурузный крахмал — 1 ст. л. (15 г)","Заменитель сахара (ФитПарад) — 4–5 саше","Ванилин — 1 г","Яичный желток С0 (от 2-го яйца) — 1 шт.","Молоко 2.5% — 1 ст. л. (~15 мл)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Замес эластичного теста (без крошек)","text":"В миске соедините 360 г творога 5% (2 пачки), 1 целое яйцо С0 , щепотку соли и 4–5 саше сахзама . Разомните вилкой в однородную кашицу (яйцо сразу свяжет сухой творог). Всыпьте 150–160 г цельнозерновой муки с 1 ч. л. разрыхлителя. Замесите тесто руками: за 1–2 минуты оно соберется в податливый, эластичный шар, напоминающий мягкий пластилин. Если творог очень сухой — добавьте 1–2 ст. л. молока. Заверните шар в пленку и уберите в холод на 15 минут ."},{"@type":"HowToStep","position":2,"name":"Приготовление творожной начинки","text":"Для начинки соедините 180 г творога (1 пачка), белок второго яйца , 1 ст. л. кукурузного крахмала (15 г) , 4–5 саше сахзама и 1 г ванилина (желток оставьте в пиале для смазки). Перетрите вилкой или взбейте блендером 20 секунд до сладкого густого крема."},{"@type":"HowToStep","position":3,"name":"Раскатка и формовка (без трещин)","text":"Припылите стол или коврик щепоткой муки. Раскатайте охлажденное тесто скалкой до толщины 4–5 мм — благодаря клейковине цельнозерновой муки оно катается ровно, не липнет и не крошится в песок. Кружкой или формой вырежьте круги диаметром 9–10 см . На одну половину круга выложите 1 ст. л. с горкой начинки , накройте второй половиной полумесяцем. Тесто согнется легко и без трещин! Края не защипывайте — начинка должна аппетитно выглядывать сбоку."},{"@type":"HowToStep","position":4,"name":"Румяная смазка и выпекание","text":"В пиале взболтайте желток второго яйца с 1 ст. л. молока и кисточкой смажьте верхушки сочников (это обеспечит аппетитный пекарский глянец). Выберите режим: 💨 В аэрогриле (основной) Дно корзины застелите пергаментом. Выпекайте партиями по 4–5 шт. при 165–170°C ровно 14–16 минут до красивого золотистого цвета. ♨️ В духовке (на весь противень) Разогрейте духовку до 180°C (режим «Верх+Низ»). Выложите все сочники на противень с пергаментом и выпекайте 20–25 минут ."},{"@type":"HowToStep","position":5,"name":"Остывание и подача","text":"Переложите сочники на решетку и дайте им постоять 10–15 минут . Горячая творожная начинка стабилизируется, а тесто станет нежным и мягким."}]}</script></head>
