<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Высокобелковый салат «Ужин нутрициолога» с тунцом и фасолью","description":"Экспресс-рецепт белкового ужина за 3 минуты без термической обработки от нутрициолога Кирилла Бородача. ~46 г белка на порцию, баланс медленных углеводов из фасоли, сочная свежесть зеленого яблока и хруст тыквенных семечек.","image":["https://bakan-off.github.io/pp-recipes/nutritionist-tuna-salad.jpg"],"recipeCategory":"Основные блюда","keywords":"Высокобелковое, До 20 мин, Без сахара","recipeYield":"1 порций","nutrition":{"@type":"NutritionInformation","calories":"84.3 ккал на 100 г","proteinContent":"10.3 г","fatContent":"1.3 г","carbohydrateContent":"6.9 г"},"recipeIngredient":["Тунец консервированный в собственном соку — 100 г (1 банка/пауч «Фортуна» без жидкости)","Фасоль консервированная красная или белая — 100 г (без рассола, например Bonduelle)","Творог мягкий 0.1% («Савушкин») — 125 г (1 баночка)","Зелёное яблоко (Гренни Смит) — 80 г (0,5 шт., можно целое по вкусу)","Лук репчатый — 30 г (0,5 маленькой луковицы)","Тыквенные семечки — 8 г (небольшая горсть)","Соль (розовая или поваренная) — по вкусу","Чёрный перец крупного помола — по вкусу (из мельницы «на зубок»)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Нарезка яблока и лука","text":"Вымойте половину плотного кисло-сладкого зелёного яблока (кожуру оставьте для сочности и клетчатки). Нарежьте яблоко аккуратными кубиками размером около 0,7–1 см и переложите в глубокую салатную миску. Половинку маленькой луковицы очистите и нашинкуйте как можно мельче, чтобы лучок дал пикантный аромат, но не перебивал нежные ингредиенты."},{"@type":"HowToStep","position":2,"name":"Добавление тунца и фасоли","text":"Вскройте банку или пауч с консервированным тунцом в собственном соку, тщательно слейте сок и переложите 100 г филе к яблоку и луку, слегка разделив крупные кусочки вилкой. Консервированную фасоль (100 г) откиньте на сито или слейте рассол прямо из банки и отправьте в миску вслед за тунцом."},{"@type":"HowToStep","position":3,"name":"Заправка мягким творогом и специями","text":"В качестве белковой кремовой заправки добавьте 125 г нежного мягкого творога (1 баночка «Савушкин»). Посолите щепоткой розовой или морской соли. Чёрный перец горошком смолите прямо в салат на самом крупном помоле мельницы — как советует нутрициолог, чтобы пряные перечные крупинки приятно попадались на зубок."},{"@type":"HowToStep","position":4,"name":"Перемешивание и подача с тыквенными семечками","text":"Лопаткой или ложкой аккуратно вымесите салат до однородного кремового распределения творожной заправки. Переложите в красивую глубокую тарелку и перед самой подачей щедро посыпьте сверху тыквенными семечками (8 г) — они обеспечат приятный контрастный хруст и полезные ненасыщенные омега-жиры."}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
