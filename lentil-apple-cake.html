<link href="assets/styles.css" rel="stylesheet"/><script type="application/ld+json" id="recipe-schema-ld">{"@context":"https://schema.org","@type":"Recipe","name":"Сладкий чечевичный кекс с яблоком и изюмом","description":"Пышный, сытный и ароматный десертный кекс-лепешка на замоченной красной чечевице с бананом, свежим яблоком и изюмом. Без пшеничной муки, рафинированного масла и добавленного сахара. Рекордный растительный протеин и долгая сытость!","image":["https://bakan-off.github.io/pp-recipes/lentil-apple-cake.jpg"],"recipeCategory":"Выпечка","keywords":"Высокобелковое, Без сахара","recipeYield":"8 порций","nutrition":{"@type":"NutritionInformation","calories":"280 ккал на 100 г","proteinContent":"13.8 г","fatContent":"1.85 г","carbohydrateContent":"54 г"},"recipeIngredient":["Красная чечевица (сухой вес) — 566 г (замочить на 2–3 часа)","Тёмный изюм — 300 г (замочить на 10–15 мин)","Яблоко свежее (очищенное) — 246 г","Банан спелый — 129 г (1 шт)","Куриные яйца С0/С1 — 3 шт","Псиллиум (шелуха подорожника) — 6 ч. л. (~20–24 г)","Разрыхлитель теста — 5 г (1 ч. л.)","Соль мелкая — 3 г (щепотка, подчеркнет сладость)"],"recipeInstructions":[{"@type":"HowToStep","position":1,"name":"Замачивание чечевицы и изюма","text":"Красную чечевицу (566 г) тщательно промойте в холодной воде и замочите на 2–3 часа (она набухнет и станет мягкой). Тёмный изюм (300 г) промойте и залейте теплой водой на 10–15 минут , затем слейте воду и обсушите салфеткой."},{"@type":"HowToStep","position":2,"name":"Приготовление фруктово-чечевичного пюре","text":"С чечевицы полностью слейте воду. Переложите размоченную чечевицу в чашу комбайна или глубокую емкость для блендера. Добавьте 3 яйца, поломанный на кусочки банан (129 г), нарезанное яблоко (246 г) и 3 г соли. Тщательно пробейте блендером до однородного гладкого пюре ."},{"@type":"HowToStep","position":3,"name":"Введение псиллиума и отдых теста (7–10 минут)","text":"В полученное пюре всыпьте 6 ч. л. псиллиума и 5 г разрыхлителя. Перемешайте силиконовой лопаткой и оставьте на 7–10 минут . Псиллиум впитает свободную влагу фруктов и чечевицы, превратив массу в пышное и податливое кексовое тесто."},{"@type":"HowToStep","position":4,"name":"Вмешивание сочного изюма","text":"В загустевшее тесто добавьте обсушенный тёмный изюм и аккуратно перемешайте лопаткой, равномерно распределяя ягодки по всему объему."},{"@type":"HowToStep","position":5,"name":"Формовка и выпекание (180°C, ~50 минут)","text":"Противень застелите качественным силиконизированным пергаментом. Выложите тесто и разровняйте лопаткой в виде большой круглой или овальной лепешки-коврижки толщиной около 2–3 см (или выложите в прямоугольную форму для кекса). Разогрейте духовку до 180°C и выпекайте около 50 минут . Готовность проверьте деревянной шпажкой — она должна выходить сухой."},{"@type":"HowToStep","position":6,"name":"Остывание и подача","text":"Дайте кексу полностью остыть на решетке. При остывании текстура стабилизируется, станет мягкой, мелкопористой и слегка влажной, как традиционная рождественская коврижка. Нарежьте на порционные кусочки."}]}</script><link rel="manifest" href="manifest.webmanifest"/></head>
